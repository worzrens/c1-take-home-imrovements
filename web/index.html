<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relay</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="sidebar">
    <header>
      <h2>Conversations</h2>
      <button id="newConv">+ New</button>
    </header>
    <form id="searchForm"><input id="search" autocomplete="off" placeholder="Search messages…" /></form>
    <ul id="conversations"></ul>
  </div>
  <div id="main">
    <h3 id="title">Pick a conversation</h3>
    <div id="messages"></div>
    <form id="composer">
      <input id="text" autocomplete="off" placeholder="Message…" />
      <button>Send</button>
    </form>
  </div>
  <script src="/app.js"></script>
</body>
</html>
