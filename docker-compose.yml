services:
  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports: ["3000:3000"]
    volumes:
      - ./docker/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on: [api]

  api:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm start
    restart: on-failure
    env_file: .env
    expose: ["3000"]
    depends_on:
      seed:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - /app/node_modules

  migrate:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm run migrate
    restart: "no"
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      mysql:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    command: npm run seed
    restart: "no"
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_started

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: relay
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mongo:
    image: mongo:7
    ports: ["27017:27017"]

  redis:
    image: redis:7
    expose: ["6379"]
